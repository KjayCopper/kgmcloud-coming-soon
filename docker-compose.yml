services:
  web:
    build: .
    image: kgmcloud-place:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    labels:
      # Cosmos Cloud routing hints
      cosmos.service: "web"
      cosmos.icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nginx.svg"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
